<main class="overview">
  <h1>{{ name() }}</h1>

  @if (imageUris().length > 0) {
  <section class="gallery-section" aria-labelledby="gallery-heading">
    <h2 id="gallery-heading" class="visually-hidden">Images of {{ name() }}</h2>
    <div class="image-carousel" tabindex="0">
      @for (imageUri of imageUris(); track imageUri) {
      <img
        #img
        role="button"
        tabindex="0"
        class="area-image"
        (click)="openImageModal(imageUri)"
        [src]="imageUri"
        [alt]="name() + ', image ' + ($index + 1)" />
      }
    </div>
  </section>
  } @if (importantInfo()) {
  <aside class="important-info" aria-labelledby="important-info-heading">
    <h2 id="important-info-heading">Important information</h2>
    <p>{{ importantInfo() }}</p>
  </aside>
  } @if (description()) {
  <section class="description" aria-labelledby="description-heading">
    <h2 id="description-heading">Description</h2>
    <p>{{ description() }}</p>
  </section>
  }

  <ng-content></ng-content>
</main>

<app-modal [variableWidth]="true" #imageModal></app-modal>
