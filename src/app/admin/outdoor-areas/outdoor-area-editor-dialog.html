<h2>{{ title() }}</h2>

<div class="form-group form-input" [class.disabled]="outdoorAreaForm.name().disabled()">
  <input id="name" type="text" autocomplete="off" placeholder="" [formField]="outdoorAreaForm.name" />
  <label for="name" class="group-label">Name</label>
</div>

<div class="form-group form-input" [class.disabled]="outdoorAreaForm.description().disabled()">
  <textarea id="description" rows="3" [formField]="outdoorAreaForm.description"></textarea>
  <label for="description" class="group-label">Description</label>
</div>

<div class="form-group form-input" [class.disabled]="outdoorAreaForm.importantInfo().disabled()">
  <textarea id="important-info" rows="2" [formField]="outdoorAreaForm.importantInfo"></textarea>
  <label for="important-info" class="group-label">Important info</label>
</div>

<div class="form-group form-input" [class.disabled]="outdoorAreaForm.previewImageUri().disabled()">
  <input
    id="preview-image-uri"
    type="url"
    autocomplete="off"
    placeholder="example/preview.jpg"
    [formField]="outdoorAreaForm.previewImageUri" />
  <label for="preview-image-uri" class="group-label">Preview image URL</label>
</div>

<app-image-url-list [(images)]="images" [isDisabled]="disabled()"></app-image-url-list>

<legend>Sectors</legend>
<p class="field-help">No sectors available yet.</p>

@if (availableSectors().length === 0) {
<p class="field-help">No sectors available yet.</p>
} @else { @for (sector of availableSectors(); track sector.id) {
<label class="checkbox-row">
  <input type="checkbox" [checked]="selectedSectorIds().has(sector.id)" (change)="onSectorToggle(sector.id, $event)" />
  {{ sector.name }}
</label>
} }

<div class="form-group form-action">
  <button
    type="button"
    class="button primary"
    (click)="onSaveAndClose()"
    [class.disabled]="isSubmitDisabled()"
    [disabled]="isSubmitDisabled()">
    Save and Close
  </button>
</div>
