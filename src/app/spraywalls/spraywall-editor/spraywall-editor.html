<div class="grid">
  <section class="renderContainer">
    @if (currentRawModel) {
    <app-camera-controls> </app-camera-controls>
    <app-spraywall-editor-renderer
      class="render"
      #renderer
      [rawModel]="currentRawModel"
      [highlightUv]="currentHighlightUv()"
      [highlightColor]="currentHoldColor()"
      [resetRoute]="resetSignal"
      [undoLastHighlight]="undoLastHighlightSignal"
      [boulderProblem]="spraywallProblemForEdit">
    </app-spraywall-editor-renderer>
    } @else {
    <app-loading-image class="render"> </app-loading-image>
    }
  </section>
  <section class="legend">
    <div class="actions">
      <button class="button action-button" (click)="openSaveModal()">
        @if (spraywallProblemForEdit) { Update Problem } @else { Save Problem }
      </button>
      <button class="button action-button" (click)="undoLastHighlightSignal.next()">Undo Last Click</button>
      <button class="button action-button" (click)="resetSignal.next()">Reset</button>
      <button class="button action-button action-end" (click)="onBackToSpraywall()">Back to Spraywall</button>
    </div>
    <div class="legend-list">
      <div class="color-selection">
        <div class="hold-color-options">
          <form>
            <legend class="form-label">Hold Type</legend>
            <div class="form-group form-radio">
              @for (option of holdColorOptions; track option.type) {
              <div class="radio-option">
                <!-- [style]="'background-color: #' + option.color.getHexString()"> -->
                <input
                  type="radio"
                  [id]="option.type + colorFormId"
                  [formField]="colorForm.spraywallHoldType"
                  [value]="option.type.toString()" />
                <label
                  [for]="option.type + colorFormId"
                  class="radio-label"
                  [class.selected]="colorForm.spraywallHoldType().value() === option.type.toString()"
                  >{{ enumName(option.type) }}</label
                >
              </div>
              }
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
</div>

<app-modal #modal (closed)="closeModal($event)"> </app-modal>
